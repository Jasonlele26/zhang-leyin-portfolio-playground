<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found - Zhang Leyin</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100svh;
      margin: 0;
      place-items: center;
      padding: 24px;
      background: #000;
      color: #fff;
      font-family: "IBM Plex Mono", Consolas, monospace;
    }
    main { width: min(760px, 100%); border: 1px solid #c0fe04; }
    header {
      padding: 14px 18px;
      background: #c0fe04;
      color: #000;
      font-size: 12px;
      text-transform: uppercase;
    }
    section { padding: 40px 18px; }
    h1 {
      margin: 0 0 24px;
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 72px;
      font-weight: 400;
      line-height: 0.9;
      text-transform: uppercase;
    }
    a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      padding: 0 18px;
      background: #c0fe04;
      color: #000;
      font-size: 11px;
      text-decoration: none;
      text-transform: uppercase;
    }
    a:hover { background: #fff; }
    @media (max-width: 560px) { h1 { font-size: 48px; } }
  </style>
</head>
<body>
  <main>
    <header>Error 404 / Route not found</header>
    <section>
      <h1>This page is off the map.</h1>
      <a href="/">Return to the portfolio</a>
    </section>
  </main>
</body>
</html>
